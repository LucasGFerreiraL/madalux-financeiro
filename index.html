<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madalux — Plataforma Financeira Inteligente</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: { DEFAULT: '#101C2C', dark: '#0a121d', light: '#1b2d45' },
                        emerald: { DEFAULT: '#087F5B', light: '#0ca678' },
                        gold: { DEFAULT: '#D4B16A', light: '#e2c585', dark: '#b8964d' },
                        grafite: { DEFAULT: '#202B3A', light: '#2d3b4e', dark: '#151d28' },
                        surface: { light: '#ffffff', dark: '#202B3A' },
                        background: { light: '#F3F5F7', dark: '#101C2C' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #D4B16A40; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #D4B16A80; }
        .privacy-on .financial-value { filter: blur(6px); user-select: none; }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300 flex flex-col md:flex-row select-none">

    <!-- App Root Container -->
    <div id="app-root" class="w-full min-h-screen flex flex-col md:flex-row"></div>

    <!-- Global Modal Container -->
    <div id="global-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div id="modal-content" class="bg-surface-light dark:bg-grafite border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-lg p-6 shadow-2xl relative animate-in fade-in zoom-in-95 duration-200"></div>
    </div>

    <!-- Open Finance Modal -->
    <div id="modal-openfinance" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-surface-light dark:bg-grafite w-full max-w-md p-6 rounded-2xl border border-gold/30 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold flex items-center"><i data-lucide="link" class="w-5 h-5 mr-2 text-gold"></i> Conectar Instituição</h3>
                <button onclick="document.getElementById('modal-openfinance').classList.add('hidden')" class="text-slate-400 hover:text-slate-100"><i data-lucide="x"></i></button>
            </div>
            <p class="text-xs text-slate-400 mb-6">Sincronize seu saldo e transações de forma automática e segura via Open Finance.</p>
            
            <div class="space-y-3 text-sm">
                <button class="w-full flex items-center justify-between p-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-gold hover:bg-gold/10 transition-all">
                    <div class="flex items-center"><div class="w-8 h-8 rounded bg-purple-600 mr-3"></div><span class="font-medium">Nubank</span></div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-500"></i>
                </button>
                <button class="w-full flex items-center justify-between p-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-gold hover:bg-gold/10 transition-all">
                    <div class="flex items-center"><div class="w-8 h-8 rounded bg-orange-500 mr-3"></div><span class="font-medium">Itaú Personnalité</span></div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-500"></i>
                </button>
                <button class="w-full flex items-center justify-between p-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-gold hover:bg-gold/10 transition-all">
                    <div class="flex items-center"><div class="w-8 h-8 rounded bg-yellow-400 mr-3"></div><span class="font-medium">Banco do Brasil</span></div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-500"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-navy dark:bg-grafite border border-gold/40 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 text-xs">
        <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400"></i>
        <span id="toast-message">Operação realizada com sucesso!</span>
    </div>

    <!-- Application JavaScript Logic -->
    <script>
        const LOGO_URL = 'https://storage.googleapis.com/generative-ai/images/Emblema%20Dourado%20Abstrato%20em%20Fundo%20Negro_2.png';

        // State Management with localStorage
        const state = {
            currentUser: JSON.parse(localStorage.getItem('madalux_current_user')) || null,
            users: JSON.parse(localStorage.getItem('madalux_users')) || [
                { id: 'usr_admin', name: 'Administrador Madalux', email: 'lucasgabriel.leite3@gmail.com', password: 'admin123', role: 'admin', status: 'approved', date: new Date().toISOString() }
            ],
            outboxEmails: JSON.parse(localStorage.getItem('madalux_outbox')) || [],
            currentTab: 'dashboard',
            isDark: true,
            isPrivate: false,
            accounts: [],
            transactions: [],
            goals: [
                { id: 'g1', title: 'Reserva de Emergência', target: 50000, current: 0, deadline: '2026-12-31', category: 'Segurança' },
                { id: 'g2', title: 'Expansão Patrimonial Global', target: 250000, current: 0, deadline: '2027-12-31', category: 'Patrimônio' },
                { id: 'g3', title: 'Aquisição de Ativo Imobiliário', target: 1200000, current: 0, deadline: '2029-06-30', category: 'Imóveis' }
            ],
            aiChat: [
                { 
                    role: 'assistant', 
                    content: 'Olá! Sou o seu Consultor Financeiro Inteligente da Madalux. O sistema encontra-se totalmente limpo e pronto para receber suas informações. Posso cadastrar suas contas bancárias, registrar receitas ou despesas conversando naturalmente, ou consultar cotações em tempo real. Como posso auxiliar em sua gestão patrimonial hoje?' 
                }
            ],
            pendingAction: null,
            authView: 'login' // 'login' or 'register' or 'pending'
        };

        const navItemsAdmin = [
            { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
            { id: 'transactions', label: 'Receitas & Despesas', icon: 'wallet' },
            { id: 'accounts', label: 'Contas & Bancos', icon: 'landmark' },
            { id: 'goals', label: 'Metas Financeiras', icon: 'target' },
            { id: 'ai-assistant', label: 'Consultor IA Madalux', icon: 'bot', badge: 'PRO' },
            { id: 'market', label: 'Mercado Financeiro', icon: 'trending-up' },
            { id: 'reports', label: 'Relatórios & Gráficos', icon: 'pie-chart' },
            { id: 'admin-panel', label: 'Painel de Aprovação', icon: 'shield-alert', badge: 'ADMIN' },
            { id: 'settings', label: 'Configurações', icon: 'settings' }
        ];

        const navItemsUser = [
            { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
            { id: 'transactions', label: 'Receitas & Despesas', icon: 'wallet' },
            { id: 'accounts', label: 'Contas & Bancos', icon: 'landmark' },
            { id: 'goals', label: 'Metas Financeiras', icon: 'target' },
            { id: 'ai-assistant', label: 'Consultor IA Madalux', icon: 'bot', badge: 'PRO' },
            { id: 'market', label: 'Mercado Financeiro', icon: 'trending-up' },
            { id: 'reports', label: 'Relatórios & Gráficos', icon: 'pie-chart' },
            { id: 'settings', label: 'Configurações', icon: 'settings' }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            loadUserData();
            renderApp();
            lucide.createIcons();
        });

        function saveToStorage() {
            localStorage.setItem('madalux_users', JSON.stringify(state.users));
            localStorage.setItem('madalux_current_user', JSON.stringify(state.currentUser));
            localStorage.setItem('madalux_outbox', JSON.stringify(state.outboxEmails));
            if (state.currentUser) {
                localStorage.setItem(`madalux_accounts_${state.currentUser.id}`, JSON.stringify(state.accounts));
                localStorage.setItem(`madalux_transactions_${state.currentUser.id}`, JSON.stringify(state.transactions));
            }
        }

        function loadUserData() {
            if (state.currentUser) {
                const accs = localStorage.getItem(`madalux_accounts_${state.currentUser.id}`);
                const txs = localStorage.getItem(`madalux_transactions_${state.currentUser.id}`);
                state.accounts = accs ? JSON.parse(accs) : [];
                state.transactions = txs ? JSON.parse(txs) : [];
            }
        }

        function renderApp() {
            const root = document.getElementById('app-root');
            
            if (!state.currentUser) {
                root.innerHTML = renderAuthScreen();
                lucide.createIcons();
                return;
            }

            if (state.currentUser.status === 'pending') {
                root.innerHTML = renderPendingScreen();
                lucide.createIcons();
                return;
            }
            if (state.currentUser.status === 'rejected') {
                root.innerHTML = renderRejectedScreen();
                lucide.createIcons();
                return;
            }

            const navs = state.currentUser.role === 'admin' ? navItemsAdmin : navItemsUser;
            
            root.innerHTML = `
                <!-- Mobile Header -->
                <header class="md:hidden flex items-center justify-between p-4 bg-surface-light dark:bg-grafite border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 flex items-center justify-center overflow-hidden">
                            <img src="${LOGO_URL}" alt="Madalux" class="w-full h-full object-contain drop-shadow-[0_0_10px_rgba(212,177,106,0.3)]">
                        </div>
                        <div>
                            <h1 class="text-[10px] uppercase tracking-widest text-gold font-semibold">Madalux</h1>
                            <span class="text-xs font-bold">Wealth Pro</span>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="togglePrivacy()" class="p-2 rounded-lg bg-slate-100 dark:bg-grafite-light text-slate-600 dark:text-slate-300 hover:text-gold transition" title="Privacidade">
                            <i data-lucide="eye" id="mobile-privacy-icon" class="w-4 h-4"></i>
                        </button>
                        <button onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-100 dark:bg-grafite-light text-slate-600 dark:text-slate-300 hover:text-gold transition" title="Tema">
                            <i data-lucide="sun" id="mobile-theme-icon" class="w-4 h-4"></i>
                        </button>
                        <button onclick="toggleMobileMenu()" class="p-2 rounded-lg bg-slate-100 dark:bg-grafite-light text-slate-600 dark:text-slate-300">
                            <i data-lucide="menu" class="w-5 h-5"></i>
                        </button>
                    </div>
                </header>

                <!-- Mobile Bottom Navigation Bar -->
                <div class="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-surface-light dark:bg-grafite border-t border-slate-200 dark:border-slate-800 px-3 py-2 flex justify-around items-center shadow-2xl">
                    <button onclick="switchTab('dashboard')" class="flex flex-col items-center space-y-1 ${state.currentTab==='dashboard'?'text-gold':'text-slate-500 dark:text-slate-400'} transition">
                        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                        <span class="text-[10px]">Início</span>
                    </button>
                    <button onclick="switchTab('transactions')" class="flex flex-col items-center space-y-1 ${state.currentTab==='transactions'?'text-gold':'text-slate-500 dark:text-slate-400'} transition">
                        <i data-lucide="wallet" class="w-5 h-5"></i>
                        <span class="text-[10px]">Extrato</span>
                    </button>
                    <button onclick="switchTab('ai-assistant')" class="flex flex-col items-center space-y-1 text-gold font-bold transition relative -top-3 bg-navy dark:bg-grafite-dark p-3 rounded-full border border-gold/40 shadow-xl">
                        <i data-lucide="bot" class="w-6 h-6 text-gold"></i>
                    </button>
                    <button onclick="switchTab('market')" class="flex flex-col items-center space-y-1 ${state.currentTab==='market'?'text-gold':'text-slate-500 dark:text-slate-400'} transition">
                        <i data-lucide="trending-up" class="w-5 h-5"></i>
                        <span class="text-[10px]">Mercado</span>
                    </button>
                    <button onclick="toggleMobileMenu()" class="flex flex-col items-center space-y-1 text-slate-500 dark:text-slate-400 hover:text-gold transition">
                        <i data-lucide="menu" class="w-5 h-5"></i>
                        <span class="text-[10px]">Menu</span>
                    </button>
                </div>

                <!-- Mobile Menu Overlay -->
                <div id="mobile-menu" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden md:hidden flex justify-end">
                    <div class="w-72 bg-surface-light dark:bg-grafite h-full p-6 flex flex-col justify-between border-l border-slate-200 dark:border-slate-800 shadow-2xl overflow-y-auto">
                        <div>
                            <div class="flex items-center justify-between mb-6">
                                <div class="flex items-center space-x-3">
                                    <div class="w-8 h-8 flex items-center justify-center">
                                        <img src="${LOGO_URL}" alt="Madalux" class="w-full h-full object-contain">
                                    </div>
                                    <span class="font-bold text-sm tracking-wider">Madalux</span>
                                </div>
                                <button onclick="toggleMobileMenu()" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-100">
                                    <i data-lucide="x" class="w-5 h-5"></i>
                                </button>
                            </div>
                            <nav class="space-y-1">
                                ${navs.map(i => `
                                    <button onclick="switchTab('${i.id}'); toggleMobileMenu();" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-medium ${state.currentTab===i.id?'bg-gold/20 text-gold':'text-slate-400'}">
                                        <i data-lucide="${i.icon}" class="w-4 h-4"></i><span>${i.label}</span>
                                    </button>
                                `).join('')}
                            </nav>
                        </div>
                        <div class="pt-4 border-t border-slate-200 dark:border-slate-700/50 pb-20">
                            <button onclick="logout()" class="w-full py-2 bg-red-500/10 text-red-400 rounded-xl font-semibold text-xs flex items-center justify-center space-x-2">
                                <i data-lucide="log-out" class="w-4 h-4"></i><span>Encerrar Sessão</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Sidebar Desktop -->
                <aside class="hidden md:flex flex-col w-72 bg-surface-light dark:bg-grafite border-r border-slate-200 dark:border-slate-800 p-6 shrink-0 sticky top-0 h-screen transition-colors duration-300">
                    <div class="flex flex-col items-center justify-center mb-8 pb-6 border-b border-gold/10">
                        <img src="${LOGO_URL}" alt="Madalux" class="h-20 object-contain drop-shadow-[0_0_15px_rgba(212,177,106,0.2)] mb-3">
                        <span class="text-xs uppercase tracking-widest text-gold font-semibold block">Madalux</span>
                        <span class="text-[10px] text-slate-400 font-medium">Wealth Management</span>
                    </div>

                    <nav class="space-y-1.5 flex-1 overflow-y-auto pr-1">
                        ${navs.map(i => `
                            <button onclick="switchTab('${i.id}')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-medium transition-all ${state.currentTab===i.id ? 'bg-gradient-to-r from-navy dark:from-grafite-light to-navy/80 text-gold border border-gold/30 shadow-md' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 hover:bg-slate-100 dark:hover:bg-grafite-light/50'}">
                                <div class="flex items-center space-x-3">
                                    <i data-lucide="${i.icon}" class="w-4 h-4 ${state.currentTab===i.id ? 'text-gold' : 'text-slate-400'}"></i>
                                    <span>${i.label}</span>
                                </div>
                                ${i.badge ? `<span class="px-1.5 py-0.5 text-[9px] bg-gold/20 text-gold font-bold rounded">${i.badge}</span>` : ''}
                            </button>
                        `).join('')}
                    </nav>

                    <div class="pt-4 mt-4 border-t border-slate-200 dark:border-slate-800 space-y-3">
                        <div class="flex items-center justify-between bg-slate-100 dark:bg-grafite-dark p-1.5 rounded-xl border border-slate-200 dark:border-slate-800 transition-colors">
                            <button onclick="togglePrivacy()" class="flex-1 py-1.5 px-2 rounded-lg text-xs font-medium flex items-center justify-center space-x-1.5 text-slate-600 dark:text-slate-300 hover:text-gold transition">
                                <i data-lucide="eye" id="desktop-privacy-icon" class="w-4 h-4"></i>
                                <span id="privacy-text">Privacidade</span>
                            </button>
                            <button onclick="toggleTheme()" class="py-1.5 px-2.5 rounded-lg text-xs font-medium flex items-center justify-center bg-white dark:bg-grafite text-slate-700 dark:text-slate-200 shadow-sm transition">
                                <i data-lucide="sun" id="desktop-theme-icon" class="w-4 h-4 text-gold"></i>
                            </button>
                        </div>
                        <div class="flex items-center justify-between px-2 pt-2">
                            <div class="truncate pr-2">
                                <p class="text-xs font-bold truncate">${state.currentUser.name}</p>
                                <p class="text-[10px] text-slate-400 truncate">${state.currentUser.email}</p>
                            </div>
                            <button onclick="logout()" class="p-2 text-slate-400 hover:text-red-400 transition" title="Sair"><i data-lucide="log-out" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                </aside>

                <!-- Main Content Area -->
                <main class="flex-1 flex flex-col min-w-0 overflow-y-auto h-screen pb-24 md:pb-8">
                    <header class="hidden md:flex items-center justify-between px-8 py-5 bg-surface-light/80 dark:bg-grafite/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-40 transition-colors duration-300">
                        <div>
                            <h2 id="page-title" class="text-xl font-bold tracking-tight text-gold">Dashboard Financeiro</h2>
                            <p id="page-subtitle" class="text-xs text-slate-500 dark:text-slate-400">Painel executivo Madalux com inteligência artificial conversacional integrada.</p>
                        </div>
                        <div class="flex items-center space-x-4">
                            <button onclick="openModal('transaction')" class="px-4 py-2 bg-gradient-to-r from-emerald to-emerald-light hover:opacity-95 text-white text-xs font-semibold rounded-xl shadow-lg shadow-emerald/20 flex items-center space-x-2 transition">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                                <span>Nova Transação</span>
                            </button>
                            <div class="w-10 h-10 rounded-full border border-gold/30 flex items-center justify-center bg-grafite overflow-hidden">
                                <img src="${LOGO_URL}" class="h-6 object-contain">
                            </div>
                        </div>
                    </header>

                    <div id="app-content" class="p-4 md:p-8 flex-1 max-w-7xl w-full mx-auto space-y-6"></div>
                </main>
            `;

            if(state.isPrivate) {
                document.body.classList.add('privacy-on');
                const iMobile = document.getElementById('mobile-privacy-icon');
                const iDesktop = document.getElementById('desktop-privacy-icon');
                if(iMobile) iMobile.setAttribute('data-lucide', 'eye-off');
                if(iDesktop) iDesktop.setAttribute('data-lucide', 'eye-off');
            }

            renderTabContent();
            lucide.createIcons();
        }

        // --- Auth Screens ---
        function renderAuthScreen() {
            if (state.authView === 'register') {
                return `
                    <div class="w-full min-h-screen flex items-center justify-center p-4 bg-background-light dark:bg-background-dark">
                        <div class="bg-surface-light dark:bg-grafite border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-md p-8 shadow-2xl space-y-6">
                            <div class="text-center space-y-2 flex flex-col items-center">
                                <img src="${LOGO_URL}" alt="Madalux" class="h-20 object-contain drop-shadow-[0_0_15px_rgba(212,177,106,0.3)] mb-2">
                                <h1 class="text-xl font-bold tracking-tight text-gold">Criar Conta Madalux</h1>
                                <p class="text-xs text-slate-400">Plataforma financeira de luxo e inteligência patrimonial.</p>
                            </div>
                            <form onsubmit="handleRegister(event)" class="space-y-4 text-xs">
                                <div>
                                    <label class="block font-medium mb-1 text-slate-400">Nome Completo</label>
                                    <input type="text" id="reg-name" required class="w-full p-3 bg-slate-100 dark:bg-grafite-dark border border-slate-700/60 rounded-xl focus:outline-none focus:border-gold">
                                </div>
                                <div>
                                    <label class="block font-medium mb-1 text-slate-400">E-mail</label>
                                    <input type="email" id="reg-email" required class="w-full p-3 bg-slate-100 dark:bg-grafite-dark border border-slate-700/60 rounded-xl focus:outline-none focus:border-gold">
                                </div>
                                <div>
                                    <label class="block font-medium mb-1 text-slate-400">Senha Segura</label>
                                    <input type="password" id="reg-password" required class="w-full p-3 bg-slate-100 dark:bg-grafite-dark border border-slate-700/60 rounded-xl focus:outline-none focus:border-gold">
                                </div>
                                <button type="submit" class="w-full py-3 bg-gold text-slate-950 font-bold rounded-xl hover:bg-gold-light transition shadow-lg shadow-gold/10">Solicitar Acesso</button>
                            </form>
                            <div class="text-center pt-2">
                                <button onclick="state.authView='login'; renderApp();" class="text-xs text-gold hover:underline">Já possui uma conta? Faça login</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="w-full min-h-screen flex items-center justify-center p-4 bg-background-light dark:bg-background-dark">
                    <div class="bg-surface-light dark:bg-grafite border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-md p-8 shadow-2xl space-y-6">
                        <div class="text-center space-y-2 flex flex-col items-center">
                            <img src="${LOGO_URL}" alt="Madalux" class="h-20 object-contain drop-shadow-[0_0_15px_rgba(212,177,106,0.3)] mb-2">
                            <h1 class="text-xl font-bold tracking-tight text-gold">Madalux Wealth</h1>
                            <p class="text-xs text-slate-400">Entre com suas credenciais para acessar sua conta.</p>
                        </div>
                        <form onsubmit="handleLogin(event)" class="space-y-4 text-xs">
                            <div>
                                <label class="block font-medium mb-1 text-slate-400">E-mail</label>
                                <input type="email" id="login-email" required class="w-full p-3 bg-slate-100 dark:bg-grafite-dark border border-slate-700/60 rounded-xl focus:outline-none focus:border-gold">
                            </div>
                            <div>
                                <label class="block font-medium mb-1 text-slate-400">Senha</label>
                                <input type="password" id="login-password" required class="w-full p-3 bg-slate-100 dark:bg-grafite-dark border border-slate-700/60 rounded-xl focus:outline-none focus:border-gold">
                            </div>

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            const user = state.users.find(u => u.email === email && u.password === password);
            if (!user) {
                showToast('E-mail ou senha incorretos.');
                return;
            }

            state.currentUser = user;
            loadUserData();
            saveToStorage();
            renderApp();
            showToast(`Bem-vindo à Madalux, ${user.name}!`);
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;

            if (state.users.some(u => u.email === email)) {
                showToast('Este e-mail já está cadastrado.');
                return;
            }

            // Se for o email do admin, aprova direto (apenas como fallback caso ele delete a conta base)
            const isAdmin = email === 'lucasgabriel.leite3@gmail.com';

            const newUser = {
                id: 'usr_' + Date.now(),
                name,
                email,
                password,
                role: isAdmin ? 'admin' : 'user',
                status: isAdmin ? 'approved' : 'pending',
                date: new Date().toISOString()
            };

            state.users.push(newUser);
            state.currentUser = newUser;
            
            if (!isAdmin) {
                state.outboxEmails.push({
                    id: 'email_' + Date.now(),
                    to: 'lucasgabriel.leite3@gmail.com',
                    subject: `Nova Solicitação de Acesso — ${name}`,
                    body: `O usuário ${name} (${email}) solicitou acesso à plataforma Madalux em ${new Date().toLocaleString('pt-BR')}. Acesse o painel para aprovar ou recusar.`,
                    userId: newUser.id,
                    date: new Date().toLocaleString('pt-BR'),
                    status: 'sent'
                });
            }

            saveToStorage();
            renderApp();
            if(!isAdmin) showToast('Cadastro realizado! Aguardando aprovação.');
        }

        function logout() {
            state.currentUser = null;
            state.authView = 'login';
            saveToStorage();
            renderApp();
            showToast('Sessão encerrada.');
        }

        function switchTab(tabId) {
            state.currentTab = tabId;
            renderApp();
        }

        function formatCurrency(value) {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
        }

        function toggleTheme() {
            state.isDark = !state.isDark;
            const html = document.documentElement;
            if (state.isDark) {
                html.classList.add('dark');
            } else {
                html.classList.remove('dark');
            }
            renderApp();
        }

        function togglePrivacy() {
            state.isPrivate = !state.isPrivate;
            if(state.isPrivate) {
                document.body.classList.add('privacy-on');
            } else {
                document.body.classList.remove('privacy-on');
            }
            renderApp();
        }

        function toggleMobileMenu() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3500);

            switch (state.currentTab) {

                    break;

        function scrollToBottomChat() {
            setTimeout(() => {
                const c = document.getElementById('chat-messages');
                if (c) c.scrollTop = c.scrollHeight;
            }, 50);
        }

        function sendQuickPrompt(text) {
            document.getElementById('chat-input').value = text;
            handleChatSubmit(new Event('submit'));
        }

        function handleChatSubmit(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            state.aiChat.push({ role: 'user', content: text });
            input.value = '';
            renderTabContent();
            scrollToBottomChat();

            setTimeout(() => {
                const lower = text.toLowerCase();
                let responseText = '';

                if (lower.includes('gastei') || lower.includes('paguei') || lower.includes('despesa')) {
                    const parsed = parseNaturalTransaction(text, 'expense');
                    if (parsed) {
                        state.pendingAction = parsed;
                        state.aiChat.push({ role: 'assistant', content: `Identifiquei uma despesa. Confira os dados para confirmar:` });
                        state.aiChat.push({ role: 'confirmation-card', data: parsed });
                        renderTabContent();
                        scrollToBottomChat();
                        return;
                    }
                } else if (lower.includes('recebi') || lower.includes('ganhei') || lower.includes('freela') || lower.includes('salário')) {
                    const parsed = parseNaturalTransaction(text, 'income');
                    if (parsed) {
                        state.pendingAction = parsed;
                        state.aiChat.push({ role: 'assistant', content: `Identifiquei uma receita. Confira os dados para confirmar:` });
                        state.aiChat.push({ role: 'confirmation-card', data: parsed });
                        renderTabContent();
                        scrollToBottomChat();
                        return;
                    }
                } else if (lower.includes('guardar') || lower.includes('poupar') || lower.includes('juros')) {
                    responseText = `📊 <strong>Simulação Madalux:</strong><br>Aporte mensal de R$ 1.000 por 24 meses acumula aproximadamente R$ 26.850 a 11,25% a.a.`;
                } else if (lower.includes('bolsa') || lower.includes('dólar')) {
                    responseText = `📈 <strong>Mercado:</strong> Ibovespa: 128.450 pts | Dólar: R$ 5,48 | Selic: 11,25% a.a.`;
                } else {
                    responseText = `Compreendi sua solicitação. Posso ajudar a registrar transações ou analisar suas contas.`;
                }

                state.aiChat.push({ role: 'assistant', content: responseText });
                renderTabContent();
                scrollToBottomChat();
            }, 600);
        }

        function parseNaturalTransaction(text, type) {
            const matchVal = text.match(/(?:r\$\s*)?(\d+[\.,]?\d*)/i);
            if (!matchVal) return null;
            let amount = parseFloat(matchVal[1].replace(',', '.'));
            let category = type === 'income' ? 'Renda Extra' : 'Outros';
            let description = text.replace(/r?\$?\s*\d+[\.,]?\d*/gi, '').trim();
            description = description ? description.charAt(0).toUpperCase() + description.slice(1) : category;

            return {
                id: 't_' + Date.now(),
                description,
                category,
                amount,
                type,
                date: new Date().toISOString().split('T')[0],
                accountId: state.accounts[0] ? state.accounts[0].id : '1',
                status: type === 'income' ? 'received' : 'paid'
            };
        }

        function confirmTransaction() {
            if (!state.pendingAction) return;
            state.transactions.unshift(state.pendingAction);
            if (state.accounts.length > 0) {
                if (state.pendingAction.type === 'income') state.accounts[0].balance += state.pendingAction.amount;
                else state.accounts[0].balance -= state.pendingAction.amount;
            }
            saveToStorage();
            state.aiChat.push({ role: 'assistant', content: `Transação de <strong><span class="financial-value">${formatCurrency(state.pendingAction.amount)}</span></strong> salva com sucesso!` });
            state.pendingAction = null;
            renderTabContent();
            scrollToBottomChat();
            showToast('Transação registrada!');
        }

        function cancelTransaction() {
            state.pendingAction = null;
            state.aiChat.push({ role: 'assistant', content: 'Operação cancelada.' });
            renderTabContent();
            scrollToBottomChat();
        }

        function clearChat() {

                                <label class="block font-medium mb-1 text-slate-400">Tipo de Conta</label>
                                <select id="acc-type" class="w-full p-2.5 bg-slate-100 dark:bg-grafite-dark border border-slate-700 rounded-xl">
                                    <option value="corrente">Conta Corrente</option>
                                    <option value="investimento">Investimento</option>
                                </select>
                            </div>
                            <div>
                                <label class="block font-medium mb-1 text-slate-400">Saldo Inicial (R$)</label>
                                <input type="number" step="0.01" id="acc-balance" required value="${acc ? acc.balance : ''}" placeholder="0.00" class="w-full p-2.5 bg-slate-100 dark:bg-grafite-dark border border-slate-700 rounded-xl">
                            </div>
                        </div>
                        <div class="pt-4 flex justify-end space-x-3">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-700 text-slate-300">Cancelar</button>
                            <button type="submit" class="px-5 py-2 bg-emerald text-white font-bold rounded-xl hover:bg-emerald-light">Salvar Conta</button>
                        </div>
                    </form>
                `;
            } else if (type === 'transaction') {
                content.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-base font-bold">Nova Transação Madalux</h3>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-100"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <form onsubmit="handleTransactionSubmit(event)" class="space-y-4 text-xs">
                        <div>
                            <label class="block font-medium mb-1 text-slate-400">Tipo</label>
                            <select id="tx-type" class="w-full p-2.5 bg-slate-100 dark:bg-grafite-dark border border-slate-700 rounded-xl">
                                <option value="expense">Despesa</option>
                                <option value="income">Receita</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-medium mb-1 text-slate-400">Descrição</label>
                            <input type="text" id="tx-desc" required placeholder="Ex: Salário, Supermercado" class="w-full p-2.5 bg-slate-100 dark:bg-grafite-dark border border-slate-700 rounded-xl">
                        </div>
                        <div>
                            <label class="block font-medium mb-1 text-slate-400">Valor (R$)</label>
                            <input type="number" step="0.01" id="tx-amount" required placeholder="0.00" class="w-full p-2.5 bg-slate-100 dark:bg-grafite-dark border border-slate-700 rounded-xl">
                        </div>
                        <div>
                            <label class="block font-medium mb-1 text-slate-400">Categoria</label>
                            <input type="text" id="tx-cat" required placeholder="Ex: Alimentação, Moradia" class="w-full p-2.5 bg-slate-100 dark:bg-grafite-dark border border-slate-700 rounded-xl">
                        </div>
                        <div class="pt-4 flex justify-end space-x-3">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-700 text-slate-300">Cancelar</button>
                            <button type="submit" class="px-5 py-2 bg-emerald text-white font-bold rounded-xl hover:bg-emerald-light">Salvar</button>
                        </div>
                    </form>
                `;
            }
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('global-modal').classList.add('hidden');
        }

        function handleAccountSubmit(e, accountId) {
            e.preventDefault();
            const name = document.getElementById('acc-name').value;
            const institution = document.getElementById('acc-inst').value;
            const type = document.getElementById('acc-type').value;
            const balance = parseFloat(document.getElementById('acc-balance').value);

            if (accountId) {
                const acc = state.accounts.find(a => a.id === accountId);
                if (acc) {
                    acc.name = name;
                    acc.institution = institution;
                    acc.type = type;
                    acc.balance = balance;
                }
                showToast('Conta atualizada com sucesso!');
            } else {
                state.accounts.push({
                    id: 'acc_' + Date.now(),
                    name,
                    institution,
                    type,
                    balance,
                    date: new Date().toISOString().split('T')[0]
                });
                showToast('Conta cadastrada com sucesso!');
            }

            saveToStorage();
            closeModal();
            renderTabContent();
        }

        function deleteAccount(accountId) {
            if (confirm('Deseja realmente excluir esta conta?')) {
                state.accounts = state.accounts.filter(a => a.id !== accountId);
                saveToStorage();
                renderTabContent();
                showToast('Conta excluída.');
            }
        }

        function handleTransactionSubmit(e) {
            e.preventDefault();
            const type = document.getElementById('tx-type').value;
            const description = document.getElementById('tx-desc').value;
            const amount = parseFloat(document.getElementById('tx-amount').value);
            const category = document.getElementById('tx-cat').value;

            state.transactions.unshift({
                id: 't_' + Date.now(),
                description,
                category,
                amount,
                type,
                date: new Date().toISOString().split('T')[0],
                status: type === 'income' ? 'received' : 'paid'
            });

            saveToStorage();
            closeModal();
            renderTabContent();
            showToast('Transação registrada!');
        }
    </script>
</body>
</html>
