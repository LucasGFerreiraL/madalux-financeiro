        // As suas chaves exatas do projeto madalux-financas

            measurementId: "G-QSS355W5GP"
        };

        const ADMIN_EMAIL = "lucasgabriel.leite3@gmail.com";
        
        let app, auth, db;
        let currentUserData = null;

        // INICIAÇÃO IMEDIATA (Removido o bloqueio DOMContentLoaded)
        lucide.createIcons();
        
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            monitorAuthState();
        } catch (error) {
            console.error("Erro ao inicializar Firebase", error);
            alert("Erro ao conectar com o banco de dados.");
        }

        document.getElementById('login-form').addEventListener('submit', handleLogin);
        document.getElementById('register-form').addEventListener('submit', handleRegister);

        async function routeUser(user) {
            const userDocRef = doc(db, "users", user.uid);
            let userDoc = await getDoc(userDocRef);
            
            if (!userDoc.exists()) {
                try {
                    await setDoc(userDocRef, {
                        uid: user.uid,
                        name: user.email === ADMIN_EMAIL ? "Lucas Gabriel (Admin)" : "Utilizador",
                        email: user.email,
                        status: (user.email === ADMIN_EMAIL) ? "approved" : "pending",
                        createdAt: new Date().toISOString()
                    });
                    userDoc = await getDoc(userDocRef);
                } catch (error) {
                    console.error("Erro ao recuperar perfil:", error);
                }
            }

            if (userDoc.exists()) {
                currentUserData = userDoc.data();
                const isAdmin = (currentUserData.email === ADMIN_EMAIL);
                
                if (isAdmin) {
                    showScreen("main-dashboard");
                    document.getElementById("admin-menu-btn").classList.remove("hidden");
                    loadAdminPanelRealtime();
                } else if (currentUserData.status === 'approved') {
                    showScreen("main-dashboard");
                    document.getElementById("admin-menu-btn").classList.add("hidden");
                } else {
                    showScreen("pending-screen");
                }
            } else {
                auth.signOut();
            }
        }

        function monitorAuthState() {
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    routeUser(user);
                } else {
                    showScreen("auth-screen");
                }
            });
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            btn.innerHTML = 'A autenticar...';
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('email-login').value, document.getElementById('pass-login').value);
            } catch (error) {
                alert("Falha no login. Verifique se o e-mail e palavra-passe estão corretos.");
                btn.innerHTML = 'Entrar';
            }
        }
